name: Assemble supplied final PDF
on:
  push:
    branches: [codex/final-2026-11-10]
    paths:
      - '.pdf-transfer/**'
      - '.github/workflows/pdf-transfer.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/final-2026-11-10
      - name: Assemble and verify losslessly optimized PDF
        run: |
          cat .pdf-transfer/part-1 .pdf-transfer/part-2 .pdf-transfer/part-3 .pdf-transfer/part-4 > innovation-final.pdf
          echo 'f314ac32ccea2d93018bc810db99a7f46914867898c9362de934fbf104163ad3  innovation-final.pdf' | sha256sum --check -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add innovation-final.pdf
          git commit -m 'Publish supplied final PDF byte-for-byte'
          git push origin HEAD:refs/heads/codex/final-2026-11-10

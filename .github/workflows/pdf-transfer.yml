name: Assemble supplied Final 53 PDF
on:
  push:
    branches: [codex/pdf-drive-update]
    paths:
      - '.pdf-transfer/**'
      - '.github/workflows/pdf-transfer.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pdf-drive-update
      - name: Assemble and verify losslessly optimized PDF
        run: |
          cat .pdf-transfer/part-1 .pdf-transfer/part-2 > innovation-final.pdf
          echo '4295e6c74e8e8a533ad475b55dca62850e9ba71208b444902fb7cef1b4c5334b  innovation-final.pdf' | sha256sum --check -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add innovation-final.pdf
          git commit -m 'Update 53-page Final PDF from supplied Drive file'
          git push origin HEAD:refs/heads/codex/pdf-drive-update

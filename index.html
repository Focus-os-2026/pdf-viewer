<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Innovation Showcase — PDF Viewer</title>
    <style>
      :root {
        font:
          14px/1.45 Inter,
          system-ui,
          -apple-system,
          "Noto Sans Thai",
          sans-serif;
        color: #202124;
        background: #f5f6f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        background: white;
        border-bottom: 1px solid #e4e5e7;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .brand {
        font-weight: 750;
        letter-spacing: -0.2px;
      }
      .tools {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      a.tool,
      input {
        background: white;
        border: 1px solid #dadddf;
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        color: #202124;
        cursor: pointer;
        text-decoration: none;
        min-height: 35px;
      }
      button:hover,
      a.tool:hover {
        background: #f1f2f3;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      input {
        width: 58px;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px;
      }
      .paper {
        margin: auto;
        background: white;
        box-shadow: 0 3px 16px #00000012;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .paper canvas {
        display: block;
        flex-shrink: 0;
        height: auto;
      }
      .paper {
        overflow: auto;
        justify-content: flex-start;
      }
      .paper canvas {
        margin: auto;
      }
      .paper [hidden] {
        display: none;
      }
      button,
      a.tool,
      input {
        min-height: 44px;
      }
      #status {
        width: 100%;
      }
      #status {
        text-align: center;
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
        color: #65676b;
      }
      #status.error {
        color: #a02323;
      }
      .hint {
        color: #7a7c80;
        text-align: center;
        font-size: 12px;
        margin: 12px 0;
      }
      .pagecounter {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      @media (max-width: 600px) {
        header {
          padding: 8px;
        }
        .brand {
          font-size: 12px;
          width: 100%;
        }
        .tools {
          width: 100%;
          justify-content: center;
          gap: 4px;
        }
        .tools button,
        .tools a.tool {
          padding: 6px 8px;
        }
        main {
          padding: 8px 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Innovation Showcase · PDF Viewer</div>
      <nav class="tools" aria-label="PDF controls">
        <button id="prev" disabled aria-label="Previous page">‹</button>
        <span class="pagecounter"
          ><input
            id="page"
            type="number"
            min="1"
            value="1"
            aria-label="Page number"
          />
          / <span id="total">…</span></span
        >
        <button id="next" disabled aria-label="Next page">›</button>
        <button id="minus" aria-label="Zoom out">−</button
        ><span id="zoom">100%</span
        ><button id="plus" aria-label="Zoom in">+</button>
        <button id="copy" aria-label="Copy link">Copy Link</button>
        <a
          class="tool"
          id="full"
          href="./innovation-final.pdf"
          target="_blank"
          rel="noopener noreferrer"
          >Full PDF</a
        >
      </nav>
    </header>
    <main>
      <div class="paper" id="paper">
        <p id="status" role="status">กำลังโหลดเอกสาร…</p>
        <canvas id="canvas" hidden aria-label="PDF page"></canvas>
      </div>
      <p class="hint">
        เปลี่ยนหน้าโดยใช้ปุ่ม ‹ › หรือปุ่มลูกศรบนคีย์บอร์ด ·
        บนมือถือปัดซ้าย–ขวาได้
      </p>
    </main>
    <script type="module">
      import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "./vendor/pdfjs/pdf.worker.min.mjs";
      const $ = (s) => document.querySelector(s);
      const UI = {
        canvas: $("#canvas"),
        status: $("#status"),
        page: $("#page"),
        total: $("#total"),
        prev: $("#prev"),
        next: $("#next"),
        zoom: $("#zoom"),
      };
      const params = new URLSearchParams(location.search);
      const PDF_URL = "./innovation-final.pdf?v=4295e6c74e8e";
      const MAP_URL = "./mapping.json";
      let ready = false;
      let doc = null,
        current = 1,
        factor = 1,
        task = null,
        renderSerial = 0,
        mapping = null;
      function show(message, error = false) {
        UI.status.textContent = message;
        UI.status.classList.toggle("error", error);
        UI.status.hidden = false;
        UI.canvas.hidden = true;
      }
      function controls() {
        for (const selector of ["#page", "#minus", "#plus", "#copy"])
          $(selector).disabled = !ready;
        UI.page.value = current;
        UI.total.textContent = doc?.numPages ?? "…";
        UI.page.max = doc?.numPages ?? 1;
        UI.prev.disabled = !doc || current <= 1;
        UI.next.disabled = !doc || current >= doc.numPages;
        UI.zoom.textContent = Math.round(factor * 100) + "%";
        $("#full").href = PDF_URL + "#page=" + current;
      }
      function setUrl(page) {
        const u = new URL(location.href);
        const match = Object.entries(mapping?.idToPage || {}).find(
          ([, n]) => Number(n) === page,
        );
        u.searchParams.delete("page");
        u.searchParams.delete("id");
        if (match) u.searchParams.set("id", match[0]);
        else u.searchParams.set("page", String(page));
        history.replaceState(null, "", u);
      }
      function safeInteger(raw) {
        if (!/^\d+$/.test(String(raw ?? ""))) return null;
        const n = Number(raw);
        return Number.isSafeInteger(n) && n > 0 ? n : null;
      }
      function resolvePage(data) {
        if (params.has("id")) {
          const id = safeInteger(params.get("id"));
          if (id === null) throw new Error("รหัสผลงานไม่ถูกต้อง");
          const p = data.idToPage[String(id)];
          if (!p) throw new Error("ไม่พบผลงาน ID " + id + " ใน PDF ฉบับนี้");
          return p;
        }
        if (params.has("page")) {
          const p = safeInteger(params.get("page"));
          if (!p) throw new Error("เลขหน้าไม่ถูกต้อง");
          return p;
        }
        return 1;
      }
      async function render() {
        if (!doc || !ready) return;
        const serial = ++renderSerial;
        const pageNo = current;
        controls();
        show("กำลังแสดงหน้า " + pageNo + "…");
        try {
          if (task) {
            const previous = task;
            previous.cancel();
            try {
              await previous.promise;
            } catch (e) {}
            if (task === previous) task = null;
          }
          if (serial !== renderSerial) return;
          const page = await doc.getPage(pageNo);
          if (serial !== renderSerial) return;
          const base = page.getViewport({ scale: 1 });
          const available = Math.max(
            240,
            Math.min(970, window.innerWidth - 24),
          );
          const scale = Math.min(available / base.width, 2.5) * factor;
          const viewport = page.getViewport({ scale });
          const dpr = Math.min(
            devicePixelRatio || 1,
            2,
            Math.sqrt(4000000 / (viewport.width * viewport.height)),
          );
          /* Keep a single canvas within a four-million-pixel budget on mobile. */ UI.canvas.width =
            Math.floor(viewport.width * dpr);
          UI.canvas.height = Math.floor(viewport.height * dpr);
          UI.canvas.style.width = viewport.width + "px";
          UI.canvas.style.height = viewport.height + "px";
          const ctx = UI.canvas.getContext("2d", { alpha: false });
          task = page.render({
            canvasContext: ctx,
            viewport,
            transform: dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0],
          });
          await task.promise;
          if (serial !== renderSerial) return;
          UI.canvas.dataset.page = String(pageNo);
          UI.canvas.setAttribute(
            "aria-label",
            "หน้า " + pageNo + " จาก " + doc.numPages,
          );
          UI.canvas.hidden = false;
          UI.status.hidden = true;
          task = null;
        } catch (err) {
          if (err?.name === "RenderingCancelledException") return;
          console.error(err);
          if (serial === renderSerial)
            show("แสดงหน้าไม่สำเร็จ กรุณาลองอีกครั้ง", true);
        }
      }
      function go(n, update = true) {
        if (!doc || !ready) return;
        const num = Math.max(
          1,
          Math.min(doc.numPages, Math.floor(Number(n) || 1)),
        );
        if (num === current && UI.status.hidden) return;
        current = num;
        if (update) setUrl(num);
        render();
      }
      async function start() {
        try {
          const [map, pdf] = await Promise.all([
            fetch(MAP_URL, { cache: "no-cache" }).then((r) => {
              if (!r.ok) throw Error("โหลด Mapping ไม่สำเร็จ");
              return r.json();
            }),
            pdfjsLib.getDocument({
              url: PDF_URL,
              disableAutoFetch: true,
              disableStream: true,
              rangeChunkSize: 262144,
            }).promise,
          ]);
          mapping = map;
          doc = pdf;
          if (!mapping.idToPage || mapping.pageCount !== doc.numPages)
            throw new Error("Mapping ไม่ตรงกับจำนวนหน้า PDF");
          const entries = Object.entries(mapping.idToPage);
          if (
            entries.length !== doc.numPages ||
            new Set(entries.map(([, p]) => p)).size !== doc.numPages ||
            entries.some(
              ([id, p]) =>
                !/^\d+$/.test(id) ||
                String(Number(id)) !== id ||
                !Number.isSafeInteger(Number(id)) ||
                Number(id) < 1 ||
                !Number.isInteger(p) ||
                p < 1 ||
                p > doc.numPages,
            )
          )
            throw new Error("Mapping มี ID หรือเลขหน้าไม่ถูกต้อง");
          const page = resolvePage(mapping);
          if (page > doc.numPages)
            throw new Error("ผลงานนี้ไม่มีใน PDF ฉบับปัจจุบัน");
          current = page;
          ready = true;
          controls();
          await render();
        } catch (err) {
          console.error(err);
          ready = false;
          doc = null;
          controls();
          show(
            (err?.message || "ไม่สามารถเปิดเอกสารได้") +
              " — ตรวจสอบว่าอัปโหลด innovation-final.pdf และ mapping.json แล้ว",
            true,
          );
        }
      }
      UI.prev.onclick = () => go(current - 1);
      UI.next.onclick = () => go(current + 1);
      UI.page.onchange = () => go(UI.page.value);
      UI.page.onkeydown = (e) => {
        if (e.key === "Enter") {
          go(UI.page.value);
          UI.page.blur();
        }
      };
      $("#minus").onclick = () => {
        factor = Math.max(0.5, Math.round((factor - 0.15) * 100) / 100);
        render();
      };
      $("#plus").onclick = () => {
        factor = Math.min(2.5, Math.round((factor + 0.15) * 100) / 100);
        render();
      };
      $("#copy").onclick = async () => {
        const u = new URL(location.href);
        u.searchParams.delete("page");
        const id = Object.entries(mapping?.idToPage || {}).find(
          ([, p]) => p === current,
        )?.[0];
        if (id) u.searchParams.set("id", id);
        else u.searchParams.set("page", String(current));
        try {
          await navigator.clipboard.writeText(u.href);
          $("#copy").textContent = "Copied ✓";
          setTimeout(() => ($("#copy").textContent = "Copy Link"), 1300);
        } catch {
          prompt("Copy link", u.href);
        }
      };
      addEventListener("keydown", (e) => {
        if (e.target instanceof HTMLInputElement) return;
        if (e.key === "ArrowLeft") go(current - 1);
        if (e.key === "ArrowRight") go(current + 1);
      });
      let tx = null,
        ty = null;
      UI.canvas.addEventListener(
        "touchstart",
        (e) => {
          tx = e.touches.length === 1 ? e.touches[0].clientX : null;
          ty = e.touches[0].clientY;
        },
        { passive: true },
      );
      UI.canvas.addEventListener(
        "touchend",
        (e) => {
          if (tx == null) return;
          const diff = e.changedTouches[0].clientX - tx;
          if (
            factor === 1 &&
            Math.abs(diff) > 60 &&
            Math.abs(diff) > Math.abs(e.changedTouches[0].clientY - ty)
          )
            go(current + (diff < 0 ? 1 : -1));
          tx = null;
        },
        { passive: true },
      );
      let resizeHandle;
      addEventListener("resize", () => {
        clearTimeout(resizeHandle);
        resizeHandle = setTimeout(() => {
          if (doc) render();
        }, 250);
      });
      controls();
      start();
    </script>
  </body>
</html>

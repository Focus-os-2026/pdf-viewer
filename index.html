<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202124">
<title>PDF Viewer</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#202124;background:#eff1f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;justify-content:space-between}.brand{font-weight:700}nav{display:flex;align-items:center;gap:8px}button,input{font:inherit;border:1px solid #d4d7dc;border-radius:9px;padding:8px;background:white}button{cursor:pointer}button:disabled{opacity:.4}input{width:64px;text-align:center}main{padding:16px 8px 35px;max-width:1100px;margin:auto}canvas{display:block;margin:auto;max-width:100%;background:#fff;box-shadow:0 4px 20px #0002}#message{text-align:center;padding:22px 12px;color:#555}#message[hidden]{display:none}.download{color:#555;text-decoration:none;font-size:13px}.download:hover{text-decoration:underline}@media(max-width:520px){header{padding:8px}.brand{width:100%;font-size:14px}nav{width:100%;justify-content:center}button{padding:8px 12px}main{padding:8px 4px 25px}}
</style>
</head>
<body>
<header><span class="brand">ผลงานนวัตกรรม ววน.</span><nav aria-label="PDF navigation"><button id="prev" aria-label="หน้าก่อนหน้า">‹</button><span>หน้า</span><input id="page" type="number" min="1" value="1" aria-label="เลขหน้า"><span id="total">/ …</span><button id="next" aria-label="หน้าถัดไป">›</button></nav><a class="download" href="ผลงานนวัตกรรม ววน.pdf" target="_blank" rel="noopener">เปิดไฟล์ PDF ต้นฉบับ</a></header>
<main><p id="message">กำลังโหลดเอกสาร…</p><canvas id="viewer" aria-label="หน้าของเอกสาร PDF"></canvas></main>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const FILE='ผลงานนวัตกรรม ววน.pdf';
const canvas=document.querySelector('#viewer'),ctx=canvas.getContext('2d');
const pageInput=document.querySelector('#page'),total=document.querySelector('#total'),msg=document.querySelector('#message');
const prev=document.querySelector('#prev'),next=document.querySelector('#next');
let pdf=null,current=1,rendering=false,pending=null;
const requested=Number(new URLSearchParams(location.search).get('page')||location.hash.match(/page=(\d+)/)?.[1]||1);
const initial=Number.isSafeInteger(requested)&&requested>0?requested:1;
function setControls(){pageInput.value=current;total.textContent=`/ ${pdf?.numPages??'…'}`;prev.disabled=!pdf||current<=1;next.disabled=!pdf||current>=pdf.numPages}
async function render(n){if(!pdf)return;if(rendering){pending=n;return}rendering=true;msg.hidden=true;try{const page=await pdf.getPage(n);const base=page.getViewport({scale:1});const availableWidth=Math.min(1000,Math.max(280,document.querySelector('main').clientWidth-8));const scale=availableWidth/base.width;const viewport=page.getViewport({scale});const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=`${viewport.width}px`;canvas.style.height=`${viewport.height}px`;await page.render({canvasContext:ctx,viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise}catch(err){msg.hidden=false;msg.textContent=`ไม่สามารถแสดงหน้านี้ได้: ${err.message}`}finally{rendering=false;if(pending!==null){const target=pending;pending=null;if(target!==n)render(target)}}}
function go(n){if(!pdf)return;const target=Math.max(1,Math.min(pdf.numPages,Math.floor(Number(n)||1)));current=target;setControls();const url=new URL(location.href);url.searchParams.set('page',String(target));history.replaceState(null,'',url);render(target);window.scrollTo({top:0,behavior:'instant'})}
prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));pageInput.addEventListener('change',()=>go(pageInput.value));pageInput.addEventListener('keydown',e=>{if(e.key==='Enter')pageInput.blur()});
try{pdf=await pdfjsLib.getDocument(FILE).promise;current=Math.min(initial,pdf.numPages);setControls();go(current)}catch(err){msg.hidden=false;msg.innerHTML='ไม่พบไฟล์ <strong>ผลงานนวัตกรรม ววน.pdf</strong> หรือไม่สามารถโหลดเอกสารได้ กรุณาอัปโหลด PDF ไปไว้ในโฟลเดอร์เดียวกับ index.html';console.error(err)}
</script>
</body>
</html>

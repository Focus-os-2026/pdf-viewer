<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101112" />
    <title>Thailand Innovation Showcase</title>
    <style>
      :root {
        font:
          14px/1.4 system-ui,
          -apple-system,
          "Noto Sans Thai",
          sans-serif;
        color: #fff;
        background: #101112;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      main {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .paper {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: auto;
        overscroll-behavior: contain;
        overflow-anchor: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y pinch-zoom;
        scrollbar-width: thin;
      }
      #pages {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-height: 100%;
      }
      .pdf-page {
        position: relative;
        flex-shrink: 0;
        background: #fff;
        overflow: hidden;
      }
      .pdf-page canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .pdf-page:not([data-rendered])::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        margin: -11px;
        border: 2px solid #ddd;
        border-top-color: #666;
        border-radius: 50%;
      }
      .pdf-page[data-loading]::after {
        animation: spin 1s linear infinite;
      }
      #status {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        margin: auto;
        padding: 24px;
        max-width: 560px;
        text-align: center;
        color: #fff;
        line-height: 1.6;
      }
      #status:not(.error)::after {
        content: "";
        display: block;
        margin: auto;
        width: 28px;
        height: 28px;
        border: 2px solid #ffffff30;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #status:not(.error)::after,
        .pdf-page[data-loading]::after {
          animation: none;
          border-style: dotted;
        }
      }
      #tool-dock {
        position: fixed;
        z-index: 5;
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
      }
      button,
      a.tool,
      input {
        font: inherit;
        color: #fff;
        background: #22262bd9;
        border: 1px solid #ffffff24;
        border-radius: 10px;
        min-width: 44px;
        min-height: 44px;
        padding: 8px;
        touch-action: manipulation;
      }
      button,
      a.tool {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none;
      }
      button:disabled,
      input:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      button:hover,
      a.tool:hover {
        background: #394047;
      }
      #tool-toggle {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 24px;
        line-height: 1;
        opacity: 0.5;
        box-shadow: 0 2px 12px #0003;
      }
      #tool-toggle:hover,
      #tool-toggle:focus-visible,
      #tool-toggle[aria-expanded="true"] {
        opacity: 1;
      }
      .tools {
        position: absolute;
        right: 0;
        bottom: 54px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: max-content;
        max-width: calc(100vw - 20px);
        padding: 8px;
        border: 1px solid #ffffff20;
        border-radius: 14px;
        background: #171a1fe8;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 24px #0005;
      }
      .tools button {
        font-size: 22px;
      }
      .pagecounter {
        display: flex;
        align-items: center;
        gap: 4px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #page {
        width: 52px;
        min-width: 0;
        text-align: center;
        appearance: textfield;
      }
      #page::-webkit-inner-spin-button,
      #page::-webkit-outer-spin-button {
        appearance: none;
        margin: 0;
      }
      svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main aria-label="เอกสาร PDF">
      <div class="paper" id="paper">
        <p id="status" role="status" aria-label="กำลังโหลดเอกสาร"></p>
        <div id="pages" hidden></div>
      </div>
    </main>
    <div id="tool-dock">
      <nav id="tools" class="tools" aria-label="เครื่องมืออ่าน PDF" hidden>
        <button id="prev" disabled aria-label="หน้าก่อนหน้า">‹</button>
        <label class="pagecounter"
          ><input
            id="page"
            type="number"
            min="1"
            value="1"
            inputmode="numeric"
            aria-label="เลขหน้า"
          /><span aria-hidden="true">/</span><span id="total">…</span></label
        >
        <button id="next" disabled aria-label="หน้าถัดไป">›</button>
        <button id="minus" aria-label="ย่อ">−</button
        ><span id="zoom" class="sr-only" aria-live="polite">100%</span
        ><button id="plus" aria-label="ขยาย">+</button>
        <button id="fit" aria-label="ปรับงานให้พอดีจอ">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z" />
          </svg>
        </button>
        <button id="fullscreen" aria-label="เปิดหรือออกจากโหมดเต็มหน้าจอ">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          </svg>
        </button>
        <a
          class="tool"
          id="full"
          href="./innovation-final.pdf"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="เปิด PDF ทั้งเล่ม"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7" /></svg
        ></a>
      </nav>
      <button
        id="tool-toggle"
        type="button"
        aria-label="เครื่องมืออ่าน PDF"
        aria-expanded="false"
        aria-controls="tools"
      >
        ⋯
      </button>
    </div>
    <script type="module" src="./viewer.mjs?v=2ae709c8852b"></script>
  </body>
</html>
